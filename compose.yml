# =============================================================================
#  #  Rename .env-example to .env and adjust the values before starting.
# =============================================================================
services:

  ytzero:
    image: ghcr.io/pelski/ytzero:latest
    container_name: ytzero
    ports:
      - "3001:3001"
    volumes:
      - ./ytzero/data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  miniflux-db:
    container_name: miniflux-db
    image: postgres:17
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      POSTGRES_USER: ${MINIFLUX_DB_USER:-miniflux}
      POSTGRES_PASSWORD: ${MINIFLUX_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${MINIFLUX_DB_NAME:-miniflux}
    volumes:
      - ./miniflux/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MINIFLUX_DB_USER:-miniflux} -d ${MINIFLUX_DB_NAME:-miniflux}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  miniflux:
    container_name: miniflux
    image: miniflux/miniflux:latest
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "8070:8080"
    environment:
      DATABASE_URL: postgres://${MINIFLUX_DB_USER:-miniflux}:${MINIFLUX_DB_PASSWORD:-changeme}@miniflux-db/${MINIFLUX_DB_NAME:-miniflux}?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:-changeme}
      TZ: ${TZ:-Etc/UTC}
    depends_on:
      miniflux-db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  baikal:
    container_name: baikal
    image: ghcr.io/aalmenar/baikal:nginx
    user: "0:0"
    ports:
      - "5232:80"
    volumes:
      - ./baikal/config:/var/www/baikal/config
      - ./baikal/data:/var/www/baikal/Specific
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  gitea:
    container_name: gitea
    image: docker.gitea.com/gitea:latest
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  filebrowser-quantum:
    container_name: filebrowser-quantum
    image: gtstef/filebrowser:latest
    user: "0:0"
    ports:
      - "8182:80"
    volumes:
      - ${FILEBROWSER_ROOT:?FILEBROWSER_ROOT must be set in .env}:/srv
      - ./filebrowser-quantum/database:/database
      - ./filebrowser-quantum/config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  nginxproxymanager:
    container_name: nginxproxymanager
    image: jc21/nginx-proxy-manager:latest
    user: "0:0"
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "8096:8096"
      - "8920:8920"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./jellyfin/config:/config
      - ${TVSHOWS_PATH:?TVSHOWS_PATH must be set in .env}:/data/tvshows
      - ${ANIME_PATH:?ANIME_PATH must be set in .env}:/data/anime
      - ${MOVIES_PATH:?MOVIES_PATH must be set in .env}:/data/movies
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - ./navidrome/data:/data
      - ${MUSIC_PATH:?MUSIC_PATH must be set in .env}:/music:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "13378:80"
    volumes:
      - ${AUDIOBOOKS_PATH:?AUDIOBOOKS_PATH must be set in .env}:/audiobooks
      - ./audiobookshelf/podcasts:/podcasts
      - ./audiobookshelf/metadata:/metadata
      - ./audiobookshelf/config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission:latest
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    volumes:
      - ./transmission/data:/config
      - ${DOWNLOADS_PATH:?DOWNLOADS_PATH must be set in .env}:/downloads
      - ./transmission/watch:/watch
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  deemix:
    container_name: deemix
    image: ghcr.io/bambanah/deemix:latest
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - UMASK_SET=022
    ports:
      - "6595:6595"
    volumes:
      # Deemix WRITES new downloads into MUSIC_PATH; Navidrome mounts it read-only.
      - ${MUSIC_PATH:?MUSIC_PATH must be set in .env}:/downloads
      - ./deemix/config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  pigallery2:
    container_name: pigallery2
    image: bpatrik/pigallery2
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "8082:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ${PHOTOS_PATH:?PHOTOS_PATH must be set in .env}:/app/data/photos
      - ./pigallery2/config:/app/data/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:latest
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "9445:80"
    volumes:
      - ./bitwarden:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  pinepods-db:
    container_name: pinepods-db
    image: postgres:17
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      POSTGRES_DB: ${PINEPODS_DB_NAME:-pinepods_database}
      POSTGRES_USER: ${PINEPODS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PINEPODS_DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pinepods/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PINEPODS_DB_USER:-postgres} -d ${PINEPODS_DB_NAME:-pinepods_database}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  pinepods-valkey:
    container_name: pinepods-valkey
    image: valkey/valkey:8-alpine
    user: "${PUID:-0}:${PGID:-0}"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  pinepods:
    container_name: pinepods
    image: madeofpendletonwool/pinepods:latest
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "8040:8040"
    environment:
      HOSTNAME: ${PINEPODS_HOSTNAME:-http://localhost:8040}
      SEARCH_API_URL: 'https://search.pinepods.online/api/search'
      PEOPLE_API_URL: 'https://people.pinepods.online'
      DB_TYPE: postgresql
      DB_HOST: pinepods-db
      DB_PORT: 5432
      DB_USER: ${PINEPODS_DB_USER:-postgres}
      DB_PASSWORD: ${PINEPODS_DB_PASSWORD:-changeme}
      DB_NAME: ${PINEPODS_DB_NAME:-pinepods_database}
      VALKEY_HOST: pinepods-valkey
      VALKEY_PORT: 6379
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      TZ: ${TZ:-Etc/UTC}
      USERNAME: ${PINEPODS_USERNAME:-admin}
      PASSWORD: ${PINEPODS_PASSWORD:-changeme}
      FULLNAME: ${PINEPODS_FULLNAME:-Admin User}
      EMAIL: ${PINEPODS_EMAIL:-admin@example.com}
    volumes:
      - ./pinepods/downloads:/opt/pinepods/downloads
      - ./pinepods/backups:/opt/pinepods/backups
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      pinepods-db:
        condition: service_healthy
      pinepods-valkey:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  jdownloader-2:
    container_name: jdownloader-2
    image: jlesage/jdownloader-2
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "5800:5800"
    volumes:
      - ./jdownloader/config:/config
      - ${DOWNLOADS_PATH:?DOWNLOADS_PATH must be set in .env}:/output
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

  owncast:
    container_name: owncast
    image: owncast/owncast:latest
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "1935:1935"
      - "8083:8080"
    volumes:
      - ./owncast/data:/app/data
    environment:
      - OWNCAST_STREAM_KEY=${OWNCAST_STREAM_KEY:-changeme}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx_network

networks:
  nginx_network:
    driver: bridge
